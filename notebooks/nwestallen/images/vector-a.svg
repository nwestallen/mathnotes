<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: var(--ge-adaptive-bg, #ffffff); color-scheme: light dark;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="97px" height="59px" viewBox="0 0 97 59" id="ge-svg-UZG5EZuf7gpxUnn_BTgf"><style type="text/css">@supports (color: light-dark(#000, #fff)) { #ge-svg-UZG5EZuf7gpxUnn_BTgf { --ge-adaptive-bg: light-dark(#ffffff, var(--ge-dark-color, #121212)); } }</style><defs><style xmlns="http://www.w3.org/1999/xhtml" id="MJX-SVG-styles">&#xa;mjx-container[overflow="scroll"][display] {&#xa;  overflow: auto clip;&#xa;  min-width: initial !important;&#xa;}&#xa;&#xa;mjx-container[overflow="truncate"][display] {&#xa;  overflow: hidden clip;&#xa;  min-width: initial !important;&#xa;}&#xa;&#xa;mjx-container[display] {&#xa;  display: block;&#xa;  text-align: center;&#xa;  justify-content: center;&#xa;  margin: .7em 0;&#xa;  padding: .3em 2px;&#xa;}&#xa;&#xa;mjx-container[display][width="full"] {&#xa;  display: flex;&#xa;}&#xa;&#xa;mjx-container[justify="left"] {&#xa;  text-align: left;&#xa;  justify-content: left;&#xa;}&#xa;&#xa;mjx-container[justify="right"] {&#xa;  text-align: right;&#xa;  justify-content: right;&#xa;}&#xa;&#xa;mjx-container[jax="SVG"] {&#xa;  direction: ltr;&#xa;  white-space: nowrap;&#xa;}&#xa;&#xa;mjx-container[jax="SVG"] &gt; svg {&#xa;  overflow: visible;&#xa;  min-height: 1px;&#xa;  min-width: 1px;&#xa;}&#xa;&#xa;mjx-container[jax="SVG"] &gt; svg a {&#xa;  fill: blue;&#xa;  stroke: blue;&#xa;}&#xa;&#xa;rect[data-sre-highlighter-added]:has(+ .mjx-selected), rect[data-sre-highlighter-bbox].mjx-selected {&#xa;  stroke: black;&#xa;  stroke-width: 80px;&#xa;}&#xa;&#xa;@media (prefers-color-scheme: dark) {&#xa;  rect[data-sre-highlighter-added]:has(+ .mjx-selected), rect[data-sre-highlighter-bbox].mjx-selected {&#xa;    stroke: #C8C8C8;&#xa;  }&#xa;}&#xa;&#xa;mjx-container[jax="SVG"] mjx-break {&#xa;  white-space: normal;&#xa;  line-height: 0;&#xa;  clip-path: rect(0 0 0 0);&#xa;  font-family: MJX-ZERO ! important;&#xa;}&#xa;&#xa;mjx-break[size="0"] {&#xa;  letter-spacing: -0.999em;&#xa;}&#xa;&#xa;mjx-break[size="1"] {&#xa;  letter-spacing: -0.889em;&#xa;}&#xa;&#xa;mjx-break[size="2"] {&#xa;  letter-spacing: -0.833em;&#xa;}&#xa;&#xa;mjx-break[size="3"] {&#xa;  letter-spacing: -0.778em;&#xa;}&#xa;&#xa;mjx-break[size="4"] {&#xa;  letter-spacing: -0.722em;&#xa;}&#xa;&#xa;mjx-break[size="5"] {&#xa;  letter-spacing: -0.667em;&#xa;}&#xa;&#xa;mjx-container[jax="SVG"] mjx-break[newline]::before {&#xa;  white-space: pre;&#xa;  content: "\A";&#xa;}&#xa;&#xa;mjx-break[newline] + svg[width="0.054ex"] {&#xa;  margin-right: -1px;&#xa;}&#xa;&#xa;mjx-break[prebreak] {&#xa;  letter-spacing: -.999em;&#xa;}&#xa;&#xa;@font-face /* zero */ {&#xa;  font-family: MJX-ZERO;&#xa;  src: url(data:application/x-font-woff;charset=utf-8;base64,) format("woff");&#xa;}&#xa;&#xa;g[data-mml-node="merror"] &gt; g {&#xa;  fill: red;&#xa;  stroke: red;&#xa;}&#xa;&#xa;g[data-mml-node="merror"] &gt; rect[data-background] {&#xa;  fill: yellow;&#xa;  stroke: none;&#xa;}&#xa;&#xa;g[data-mml-node="mtable"] &gt; line[data-line], svg[data-table] &gt; g &gt; line[data-line] {&#xa;  stroke-width: 70px;&#xa;  fill: none;&#xa;}&#xa;&#xa;g[data-mml-node="mtable"] &gt; rect[data-frame], svg[data-table] &gt; g &gt; rect[data-frame] {&#xa;  stroke-width: 70px;&#xa;  fill: none;&#xa;}&#xa;&#xa;g[data-mml-node="mtable"] &gt; .mjx-dashed, svg[data-table] &gt; g &gt; .mjx-dashed {&#xa;  stroke-dasharray: 140;&#xa;}&#xa;&#xa;g[data-mml-node="mtable"] &gt; .mjx-dotted, svg[data-table] &gt; g &gt; .mjx-dotted {&#xa;  stroke-linecap: round;&#xa;  stroke-dasharray: 0,140;&#xa;}&#xa;&#xa;g[data-mml-node="mtable"] &gt; g &gt; svg {&#xa;  overflow: visible;&#xa;}&#xa;&#xa;[jax="SVG"] mjx-tool {&#xa;  display: inline-block;&#xa;  position: relative;&#xa;  width: 0;&#xa;  height: 0;&#xa;}&#xa;&#xa;[jax="SVG"] mjx-tool &gt; mjx-tip {&#xa;  position: absolute;&#xa;  top: 0;&#xa;  left: 0;&#xa;}&#xa;&#xa;mjx-tool &gt; mjx-tip {&#xa;  display: inline-block;&#xa;  line-height: 0;&#xa;  padding: .2em;&#xa;  border: 1px solid #888;&#xa;  background-color: #F8F8F8;&#xa;  color: black;&#xa;  box-shadow: 2px 2px 5px #AAAAAA;&#xa;}&#xa;&#xa;g[data-mml-node="maction"][data-toggle] {&#xa;  cursor: pointer;&#xa;}&#xa;&#xa;mjx-status {&#xa;  display: block;&#xa;  position: fixed;&#xa;  left: 1em;&#xa;  bottom: 1em;&#xa;  min-width: 25%;&#xa;  padding: .2em .4em;&#xa;  border: 1px solid #888;&#xa;  font-size: 90%;&#xa;  background-color: #F8F8F8;&#xa;  color: black;&#xa;}&#xa;&#xa;g[data-mjx-collapsed] {&#xa;  fill: #55F;&#xa;}&#xa;&#xa;@media (prefers-color-scheme: dark) /* svg maction */ {&#xa;  mjx-tool &gt; mjx-tip {&#xa;    background-color: #303030;&#xa;      color: #E0E0E0;&#xa;      box-shadow: 2px 2px 5px #000;&#xa;  }&#xa;  mjx-status {&#xa;    background-color: #303030;&#xa;      color: #E0E0E0;&#xa;  }&#xa;  g[data-mjx-collapsed] {&#xa;    fill: #88F;&#xa;  }&#xa;}&#xa;&#xa;foreignObject[data-mjx-xml] {&#xa;  font-family: initial;&#xa;  line-height: normal;&#xa;  overflow: visible;&#xa;}&#xa;&#xa;foreignObject[data-mjx-html] {&#xa;  overflow: visible;&#xa;}&#xa;&#xa;mjx-measure-xml {&#xa;  position: absolute;&#xa;  left: 0;&#xa;  top: 0;&#xa;  display: inline-block;&#xa;  line-height: normal;&#xa;  white-space: normal;&#xa;}&#xa;&#xa;mjx-html {&#xa;  display: inline-block;&#xa;  line-height: normal;&#xa;  text-align: initial;&#xa;  white-space: initial;&#xa;}&#xa;&#xa;mjx-html-holder {&#xa;  display: block;&#xa;  position: absolute;&#xa;  top: 0;&#xa;  left: 0;&#xa;  bottom: 0;&#xa;  right: 0;&#xa;}&#xa;&#xa;mjx-container[jax="SVG"] path[data-c], mjx-container[jax="SVG"] use[data-c] {&#xa;  stroke-width: 3;&#xa;}&#xa;</style></defs><rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: var(--ge-adaptive-bg, #ffffff);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="pjA9Dgq_AalZShZFQIFZ-1"><g transform="translate(0.5,0.5)"><path 